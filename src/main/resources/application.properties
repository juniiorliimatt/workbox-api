spring.application.name=workbox-api
spring.profiles.active=${PROFILE_ACTIVE:dev}
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog.yaml
spring.jpa.open-in-view=false
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET:MyS3cur3P@ssw0rd12345!ThisIs32Bytes!}
admin.password=admin
springdoc.writer-with-order-by-keys=true

frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# SMTP real é opcional — sem host alcançável, o envio falha e é só logado (ver
# MailService); a aplicação nunca deixa de subir por causa disso.
mail.host=${MAIL_HOST:localhost}
mail.port=${MAIL_PORT:25}
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:no-reply@workbox.local}

# Login social (Google) fica desativado por padrão — só ativa se
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID/_CLIENT_SECRET forem
# definidos como variável de ambiente (Spring Boot faz o relaxed binding sozinho, não
# precisa declarar chave nenhuma aqui — se declarasse com default vazio, a aplicação
# quebraria na subida tentando validar um client_id em branco).
