spring.main.banner-mode=console
spring.output.ansi.enabled=always

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=sa

spring.liquibase.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.format_sql=false
spring.jpa.properties.show_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

debug=false
logging.level.org.springframework.jdbc.datasource.init=off
logging.level.org.springframework.boot.autoconfigure=off
logging.level.net.lbruun.springboot.preliquibase=off
logging.level.liquibase=off

