image: eclipse-temurin:25-jdk-jammy

stages:
  - test
  - contract
  - build

# docker:dind — RealPostgresSchemaIT (Testcontainers) precisa de um daemon Docker
# acessível; a Testcontainers-java fala com a Docker Remote API via DOCKER_HOST
# diretamente (não invoca o binário `docker`), então nada precisa ser instalado na
# imagem além dessa env var. Vale pra qualquer job cuja task dependa de `test`
# (test, build e sonarcloud-check — este último via `tasks.named('sonar')
# { dependsOn(test) }` no build.gradle).
default:
  services:
    - docker:dind

test:
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew check test

contract-drift-check:
  stage: contract
  script:
    - chmod +x gradlew
    - cp openapi/openapi.yaml openapi/openapi.yaml.committed
    - ./gradlew generateOpenApiDocs
    - diff -u openapi/openapi.yaml.committed openapi/openapi.yaml || (echo "O contrato openapi/openapi.yaml está desatualizado. Rode './gradlew generateOpenApiDocs' e faça commit do resultado." && exit 1)
  artifacts:
    paths:
      - openapi/openapi.yaml
    expire_in: 1 week

build:
  stage: build
  script:
    - chmod +x gradlew
    - ./gradlew clean build
  artifacts:
    paths:
      - build/libs/api-0.0.1-SNAPSHOT.jar
    expire_in: 1 week

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  TESTCONTAINERS_RYUK_DISABLED: "true"  # container de limpeza do Testcontainers costuma travar em runners restritos

sonarcloud-check:
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - chmod +x gradlew
    - ./gradlew sonar
  only:
    - merge_requests
    - main

after_script:
  - echo “End CI”
