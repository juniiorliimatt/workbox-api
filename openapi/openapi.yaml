openapi: 3.1.0
info:
  contact:
    email: oojuniin@outlook.com
    name: Junior Lima
  description: "Contrato REST da Workbox API. Este documento é a fonte da verdade\
    \ para qualquer client (frontend, agentes de IA) que consuma esta API — não assuma\
    \ comportamento não descrito aqui."
  title: Workbox API
  version: 0.0.1
servers:
- description: Relativo ao host onde a API estiver publicada
  url: /
security:
- bearer-jwt: []
paths:
  /api/v1/audit/logins:
    get:
      operationId: findLoginAudits
      parameters:
      - in: query
        name: email
        required: false
        schema:
          type: string
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageLoginAuditDTO"
          description: OK
      tags:
      - audit-controller
  /api/v1/audit/roles/{id}/history:
    get:
      operationId: findRoleHistory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleRevisionDTO"
          description: OK
      tags:
      - audit-controller
  /api/v1/audit/users/{id}/history:
    get:
      operationId: findUserHistory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserApiRevisionDTO"
          description: OK
      tags:
      - audit-controller
  /api/v1/auth/avatar:
    delete:
      operationId: deleteAvatar
      responses:
        "200":
          description: OK
      tags:
      - auth-controller
    post:
      operationId: uploadAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApiLoginCredentialsDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserApiDTO"
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/mfa/disable:
    post:
      operationId: disableMfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeDTO"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/mfa/enroll:
    post:
      operationId: enrollMfa
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/mfa/login:
    post:
      operationId: mfaLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaLoginDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeDTO"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/password:
    put:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordDTO"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApiRegisterDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDTO"
        required: true
      responses:
        "200":
          description: OK
      tags:
      - auth-controller
  /api/v1/role:
    get:
      operationId: findAll
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleDTO"
          description: OK
      tags:
      - role-controller
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDTO"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleDTO"
          description: Created
      tags:
      - role-controller
  /api/v1/role/{id}:
    delete:
      operationId: delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
      tags:
      - role-controller
    get:
      operationId: findById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleDTO"
          description: OK
      tags:
      - role-controller
    put:
      operationId: update_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleDTO"
          description: OK
      tags:
      - role-controller
  /api/v1/user/find-all:
    get:
      operationId: findAll_2
      parameters:
      - in: query
        name: User API
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollectionModelUserApiDTO"
          description: OK
      tags:
      - user-api-controller
  /api/v1/user/pageable:
    get:
      operationId: findAll_1
      parameters:
      - in: query
        name: pageable
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      - in: query
        name: User API
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserApiDTO"
          description: OK
      tags:
      - user-api-controller
  /api/v1/user/save:
    post:
      operationId: save
      parameters:
      - in: query
        name: User API
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApiInsertOrUpdateDTO"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserApiDTO"
          description: Created
      tags:
      - user-api-controller
  /api/v1/user/update:
    put:
      operationId: update
      parameters:
      - in: query
        name: User API
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApiInsertOrUpdateDTO"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserApiDTO"
          description: OK
      tags:
      - user-api-controller
  /api/v1/user/{id}:
    delete:
      operationId: delete_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      tags:
      - user-api-controller
    get:
      operationId: findById_1
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: User API
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntityModelUserApiDTO"
          description: OK
      tags:
      - user-api-controller
  /api/v1/user/{id}/avatar:
    get:
      operationId: getAvatar
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: byte
          description: OK
      tags:
      - user-api-controller
components:
  schemas:
    ChangePasswordDTO:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 100
          minLength: 8
      required:
      - currentPassword
      - newPassword
    CollectionModelUserApiDTO:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            userApiDTOList:
              type: array
              items:
                $ref: "#/components/schemas/UserApiDTO"
        _links:
          $ref: "#/components/schemas/Links"
    EntityModelUserApiDTO:
      type: object
      properties:
        _links:
          $ref: "#/components/schemas/Links"
        avatarUrl:
          type: string
        email:
          type: string
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        socialName:
          type: string
    ForgotPasswordDTO:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    GrantedAuthority:
      type: object
      properties:
        authority:
          type: string
    Link:
      type: object
      properties:
        deprecation:
          type:
          - string
          - "null"
        href:
          type: string
        hreflang:
          type:
          - string
          - "null"
        name:
          type:
          - string
          - "null"
        profile:
          type:
          - string
          - "null"
        templated:
          type: boolean
        title:
          type:
          - string
          - "null"
        type:
          type:
          - string
          - "null"
    Links:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Link"
    LoginAuditDTO:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: string
          format: uuid
        ipAddress:
          type: string
        reason:
          type: string
        successful:
          type: boolean
    MfaCodeDTO:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: "\\d{6}"
      required:
      - code
    MfaLoginDTO:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: "\\d{6}"
        mfaToken:
          type: string
          minLength: 1
      required:
      - code
      - mfaToken
    PageLoginAuditDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/LoginAuditDTO"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageUserApiDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserApiDTO"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: "#/components/schemas/SortObject"
        unpaged:
          type: boolean
    RefreshTokenDTO:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    ResetPasswordDTO:
      type: object
      properties:
        newPassword:
          type: string
          maxLength: 100
          minLength: 8
        token:
          type: string
          minLength: 1
      required:
      - newPassword
      - token
    Role:
      type: object
      properties:
        authority:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        deletedAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserApi"
          uniqueItems: true
      required:
      - authority
    RoleDTO:
      type: object
      properties:
        authority:
          type: string
          minLength: 1
        id:
          type: integer
          format: int64
      required:
      - authority
    RoleRevisionDTO:
      type: object
      properties:
        authority:
          type: string
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        deletedAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int32
        revisionType:
          type: string
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    UserApi:
      type: object
      properties:
        accountNonExpired:
          type: boolean
        accountNonLocked:
          type: boolean
        authorities:
          type: array
          items:
            $ref: "#/components/schemas/GrantedAuthority"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        credentialsNonExpired:
          type: boolean
        deletedAt:
          type: string
          format: date-time
        email:
          type: string
          format: email
          minLength: 1
        enabled:
          type: boolean
        failedLoginAttempts:
          type: integer
          format: int32
        id:
          type: string
          format: uuid
        isAccountNonExpired:
          type: boolean
        isAccountNonLocked:
          type: boolean
        isCredentialsNonExpired:
          type: boolean
        isEnabled:
          type: boolean
        lockedUntil:
          type: string
          format: date-time
        mfaEnabled:
          type: boolean
        mfaSecret:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          uniqueItems: true
        socialName:
          type: string
          maxLength: 120
          minLength: 2
        tokenVersion:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
      - email
      - socialName
    UserApiDTO:
      type: object
      properties:
        _links:
          $ref: "#/components/schemas/Links"
        avatarUrl:
          type: string
        email:
          type: string
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        socialName:
          type: string
    UserApiInsertOrUpdateDTO:
      type: object
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
        isEnabled:
          type: boolean
        password:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          uniqueItems: true
        socialName:
          type: string
    UserApiLoginCredentialsDTO:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    UserApiRegisterDTO:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 100
          minLength: 8
        socialName:
          type: string
          maxLength: 120
          minLength: 2
      required:
      - email
      - password
      - socialName
    UserApiRevisionDTO:
      type: object
      properties:
        changedAt:
          type: string
          format: date-time
        changedBy:
          type: string
        deletedAt:
          type: string
          format: date-time
        email:
          type: string
        enabled:
          type: boolean
        id:
          type: string
          format: uuid
        mfaEnabled:
          type: boolean
        revision:
          type: integer
          format: int32
        revisionType:
          type: string
        socialName:
          type: string
  securitySchemes:
    bearer-jwt:
      bearerFormat: JWT
      name: bearer-jwt
      scheme: bearer
      type: http
