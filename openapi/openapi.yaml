openapi: 3.1.0
info:
  title: Workbox API
  description: "Contrato REST da Workbox API. Este documento é a fonte da verdade\
    \ para qualquer client (frontend, agentes de IA) que consuma esta API — não assuma\
    \ comportamento não descrito aqui."
  contact:
    name: Junior Lima
    email: oojuniin@outlook.com
  version: 0.0.1
servers:
- url: /
  description: Relativo ao host onde a API estiver publicada
security:
- bearer-jwt: []
paths:
  /api/user/update:
    put:
      tags:
      - user-api-controller
      operationId: update
      parameters:
      - name: User API
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApiInsertOrUpdateDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserApiDTO"
  /api/user/save:
    post:
      tags:
      - user-api-controller
      operationId: save
      parameters:
      - name: User API
        in: query
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApiInsertOrUpdateDTO"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserApiDTO"
  /api/auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      parameters:
      - name: refreshToken
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApiLoginCredentialsDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/user/{id}:
    get:
      tags:
      - user-api-controller
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: User API
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntityModelUserApiDTO"
    delete:
      tags:
      - user-api-controller
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /api/user/pageable:
    get:
      tags:
      - user-api-controller
      operationId: findAll
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      - name: User API
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUserApiDTO"
  /api/user/find-all:
    get:
      tags:
      - user-api-controller
      operationId: findAll_1
      parameters:
      - name: User API
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CollectionModelUserApiDTO"
components:
  schemas:
    GrantedAuthority:
      type: object
      properties:
        authority:
          type: string
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        authority:
          type: string
          minLength: 1
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserApi"
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
      required:
      - authority
    UserApi:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 50
          minLength: 5
        password:
          type: string
          writeOnly: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          uniqueItems: true
        isEnabled:
          type: boolean
        isAccountNonExpired:
          type: boolean
        isAccountNonLocked:
          type: boolean
        isCredentialsNonExpired:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        enabled:
          type: boolean
        authorities:
          type: array
          items:
            $ref: "#/components/schemas/GrantedAuthority"
        accountNonExpired:
          type: boolean
        accountNonLocked:
          type: boolean
        credentialsNonExpired:
          type: boolean
      required:
      - username
    UserApiInsertOrUpdateDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        password:
          type: string
        isEnabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          uniqueItems: true
    UserApiDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        enabled:
          type: boolean
        _links:
          $ref: "#/components/schemas/Links"
    UserApiLoginCredentialsDTO:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    EntityModelUserApiDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        enabled:
          type: boolean
        _links:
          $ref: "#/components/schemas/Links"
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageUserApiDTO:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserApiDTO"
        number:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        unpaged:
          type: boolean
        sort:
          $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        unsorted:
          type: boolean
        sorted:
          type: boolean
    CollectionModelUserApiDTO:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            userApiDTOList:
              type: array
              items:
                $ref: "#/components/schemas/UserApiDTO"
        _links:
          $ref: "#/components/schemas/Links"
    Link:
      type: object
      properties:
        href:
          type: string
        hreflang:
          type:
          - string
          - "null"
        title:
          type:
          - string
          - "null"
        type:
          type:
          - string
          - "null"
        deprecation:
          type:
          - string
          - "null"
        profile:
          type:
          - string
          - "null"
        name:
          type:
          - string
          - "null"
        templated:
          type: boolean
    Links:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/Link"
  securitySchemes:
    bearer-jwt:
      type: http
      name: bearer-jwt
      scheme: bearer
      bearerFormat: JWT
