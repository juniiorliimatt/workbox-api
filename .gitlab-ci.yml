image: openjdk:23-jdk-slim

stages:
  - test
  - build

test:
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew check test

build:
  stage: build
  script:
    - chmod +x gradlew
    - ./gradlew clean build
  artifacts:
    paths:
      - build/libs/api-0.0.1-SNAPSHOT.jar
    expire_in: 1 week

after_script:
  - echo “End CI”
