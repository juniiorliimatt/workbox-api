spring.main.banner-mode=console
spring.output.ansi.enabled=always

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=sa

spring.liquibase.enabled=false

# ApiControllerTestConfig sobrescreve intencionalmente beans de segurança (secretKey,
# securityFilterChain, authManager) definidos em ApiConfig/SecurityConfig para isolar
# os testes de controller do fluxo real de autenticação/DB.
spring.main.allow-bean-definition-overriding=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.format_sql=false
spring.jpa.properties.show_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

debug=false
logging.pattern.console=%clr(%d{yy-MM-dd E HH:mm:ss.SSS}){blue} %clr(%-5p) %clr(${PID}){faint} %clr(---){faint} %clr([%8.15t]){cyan} %clr(%-40.40logger{0}){blue} %clr(:){red} %clr(%m){faint}%n
logging.level.org.springframework.jdbc.datasource.init=info
logging.level.org.springframework.boot.autoconfigure=info
logging.level.net.lbruun.springboot.preliquibase=info
logging.level.liquibase=info
logging.level.root=info
logging.level.web=info

